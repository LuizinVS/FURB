spring.application.name=RestAPIFurb
server.servlet.context-path=/RestAPIFurb

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restapifurb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Em producao, defina JWT_SECRET com no minimo 32 caracteres aleatorios.
jwt.secret=${JWT_SECRET:desenvolvimento-chave-jwt-minimo-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

springdoc.swagger-ui.path=/swagger-ui.html
